name: Probe booking sites

# One-off experiment: can GitHub reach the booking sites through Cloudflare WARP?
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sleep 5

      - name: Connect WARP in local proxy mode
        run: |
          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy
          warp-cli --accept-tos proxy port 40000 || warp-cli --accept-tos set-proxy-port 40000 || true
          warp-cli --accept-tos connect
          sleep 8
          warp-cli --accept-tos status || true

      - name: Compare direct and WARP access
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36'
          PROXY='socks5h://127.0.0.1:40000'
          echo "== exit address"
          echo "direct: $(curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(loc|colo|warp)=' | tr '\n' ' ')"
          echo "warp:   $(curl -s --max-time 15 -x $PROXY https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(loc|colo|warp)=' | tr '\n' ' ')"
          probe() {
            echo "== $1"
            echo "direct: $(curl -s -o /dev/null --max-time 30 -A "$UA" -H 'Accept-Language: en-IN,en;q=0.9' -w '%{http_code} %{size_download} bytes' "${@:3}" "$2")"
            echo "warp:   $(curl -s -o /dev/null --max-time 30 -A "$UA" -H 'Accept-Language: en-IN,en;q=0.9' -x $PROXY -w '%{http_code} %{size_download} bytes' "${@:3}" "$2")"
          }
          probe "District Dune" "https://www.district.in/movies/dune-part-three-movie-tickets-in-kolkata-MV207332"
          probe "District Doomsday" "https://www.district.in/movies/avengers-doomsday-movie-tickets-in-kolkata-MV176735"
          probe "PVR INOX" "https://api3.pvrcinemas.com/api/v1/booking/content/nowshowing" \
            -X POST -H 'Content-Type: application/json' -H 'city: Kolkata' -H 'appVersion: 1.0' \
            -H 'platform: WEBSITE' -H 'country: INDIA' -H 'chain: PVR' \
            -H 'Origin: https://www.pvrcinemas.com' -H 'Referer: https://www.pvrcinemas.com/' \
            -d '{"city":"Kolkata"}'
          probe "BookMyShow Dune" "https://in.bookmyshow.com/movies/kolkata/dune-part-three/ET00491771"
          echo "== done (200 with a large size means readable; 403 means blocked)"
